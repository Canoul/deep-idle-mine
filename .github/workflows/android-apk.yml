# Appli mobile : fabrique l'APK Android de TEST (signée avec une clé de debug, propre à chaque fabrication).
# Se lance tout seul quand mobile/ change (ou à la main : onglet Actions → « Run workflow »).
# L'APK se télécharge dans l'onglet Actions → la fabrication → « Artifacts » (guide : docs/appli-mobile.md).
# Le serveur du jeu n'utilise jamais ce fichier ni le dossier mobile/.
name: Appli Android (APK de test)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Capacitor (dépendances, réglages copiés dans le projet Android)
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Fabrication de l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: deep-mine-idle-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
