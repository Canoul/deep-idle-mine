# Appli Android. Sans Android Studio : tout se compile ici (guide : docs/app-android.md).
# - À la main (Actions → « Appli Android » → Run workflow) : choisir apk (test), aab (Google Play, signé) ou les deux.
# - Tout seul quand mobile/ change : APK de test seulement, jamais de clé.
# Le fichier s'appelle encore android-apk.yml : c'est le nom que GitHub connaît sur main. Le serveur du jeu ne l'utilise jamais.
name: Appli Android

on:
  workflow_dispatch:
    inputs:
      build:
        description: Que fabriquer ?
        type: choice
        options: [apk, aab, les deux]
        default: apk
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WANT: 'aab'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fichiers du jeu copiés dans l'appli, projet Android à jour
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: APK de test (clé de debug, pour un téléphone)
        if: env.WANT != 'aab'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Permissions et version de l'APK (visibles dans le résumé de la fabrication)
        if: env.WANT != 'aab'
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          echo "::notice title=Permissions::$("$AAPT" dump permissions "$APK" | grep -o "name='[^']*'" | tr '\n' ' ')"
          echo "::notice title=Version::$("$AAPT" dump badging "$APK" | head -1)"
          echo "::notice title=Nom::$("$AAPT" dump badging "$APK" | grep "^application-label:")"

      - uses: actions/upload-artifact@v4
        if: env.WANT != 'aab'
        with:
          name: deep-mine-idle-apk-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: AAB de production, signé avec la clé d'envoi
        if: env.WANT != 'apk'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: essai-jetable
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: essai-jetable
        run: |
          keytool -genkeypair -keystore /tmp/j.jks -alias upload -keyalg RSA -keysize 2048 -validity 1 -storetype PKCS12 -storepass essai-jetable -dname CN=essai
          KEYSTORE_BASE64=$(base64 -w0 /tmp/j.jks)
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Secrets manquants : voir docs/app-android.md"; exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - uses: actions/upload-artifact@v4
        if: env.WANT != 'apk'
        with:
          name: deep-mine-idle-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
